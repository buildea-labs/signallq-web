name: Deploy one-shot production

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-once-production.yml

permissions:
  contents: read

concurrency:
  group: vercel-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar produção 962bc498bae3e5476747f981a0ef7e67de46cda9
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 58.4.4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 962bc498bae3e5476747f981a0ef7e67de46cda9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validar configuração de publicação
        shell: bash
        run: |
          for value in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!value}" ]; then
              echo "Configuração ausente: $value" >&2
              exit 1
            fi
          done

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Obter configuração Vercel de produção
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Preparar artefato Vercel de produção
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"

      - name: Publicar produção
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
